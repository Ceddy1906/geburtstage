<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B9A"/>
      <stop offset="0.55" stop-color="#C45CFF"/>
      <stop offset="1" stop-color="#6C5CFF"/>
    </linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3B0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/>
    </radialGradient>
    <path id="flame" d="M0,-30 C12,-14 15,-2 0,10 C-15,-2 -12,-14 0,-30 Z"/>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- soft highlight -->
  <ellipse cx="170" cy="70" rx="260" ry="120" fill="#FFFFFF" opacity="0.10"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" opacity="0.75">
    <path d="M92 118 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z"/>
    <path d="M420 96 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/>
    <path d="M430 262 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity="0.7"/>
    <circle cx="70" cy="300" r="5"/>
    <circle cx="448" cy="170" r="4"/>
  </g>

  <g transform="translate(0,-14)">
    <!-- plate shadow + plate -->
    <ellipse cx="256" cy="430" rx="170" ry="14" fill="#2A1060" opacity="0.28"/>
    <rect x="88" y="404" width="336" height="20" rx="10" fill="#FFFFFF"/>

    <!-- bottom tier -->
    <rect x="116" y="296" width="280" height="112" rx="24" fill="url(#cake)"/>
    <g fill="#FF8FB1">
      <rect x="116" y="296" width="280" height="36" rx="24"/>
      <g id="drips2">
        <circle cx="130" cy="332" r="14"/><circle cx="158" cy="332" r="14"/>
        <circle cx="186" cy="332" r="14"/><circle cx="214" cy="332" r="14"/>
        <circle cx="242" cy="332" r="14"/><circle cx="270" cy="332" r="14"/>
        <circle cx="298" cy="332" r="14"/><circle cx="326" cy="332" r="14"/>
        <circle cx="354" cy="332" r="14"/><circle cx="382" cy="332" r="14"/>
      </g>
    </g>
    <!-- sprinkles -->
    <g stroke-linecap="round" stroke-width="8">
      <path d="M150 366 l12 -8" stroke="#FFC93C"/>
      <path d="M196 380 l10 8" stroke="#6C5CFF"/>
      <path d="M244 360 l12 6" stroke="#2BC8D6"/>
      <path d="M292 382 l12 -7" stroke="#FFC93C"/>
      <path d="M338 362 l11 8" stroke="#FF5C8A"/>
      <path d="M372 384 l8 -10" stroke="#2BC8D6"/>
    </g>

    <!-- top tier -->
    <rect x="166" y="232" width="180" height="72" rx="20" fill="url(#cake)"/>
    <g fill="#FFA8C5">
      <rect x="166" y="232" width="180" height="32" rx="20"/>
      <circle cx="181" cy="264" r="15"/><circle cx="211" cy="264" r="15"/>
      <circle cx="241" cy="264" r="15"/><circle cx="271" cy="264" r="15"/>
      <circle cx="301" cy="264" r="15"/><circle cx="331" cy="264" r="15"/>
    </g>

    <!-- candles -->
    <g>
      <rect x="209" y="186" width="16" height="50" rx="6" fill="#FFD54F"/>
      <rect x="248" y="178" width="16" height="58" rx="6" fill="#2BC8D6"/>
      <rect x="287" y="186" width="16" height="50" rx="6" fill="#FFD54F"/>
      <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7">
        <path d="M212 200 l10 -6 M212 214 l10 -6 M212 228 l10 -6"/>
        <path d="M251 194 l10 -6 M251 208 l10 -6 M251 222 l10 -6"/>
        <path d="M290 200 l10 -6 M290 214 l10 -6 M290 228 l10 -6"/>
      </g>
    </g>

    <!-- flames -->
    <g>
      <circle cx="217" cy="166" r="30" fill="url(#glow)"/>
      <circle cx="256" cy="158" r="30" fill="url(#glow)"/>
      <circle cx="295" cy="166" r="30" fill="url(#glow)"/>
      <use href="#flame" transform="translate(217,180)" fill="#FFB020"/>
      <use href="#flame" transform="translate(256,172)" fill="#FFB020"/>
      <use href="#flame" transform="translate(295,180)" fill="#FFB020"/>
      <use href="#flame" transform="translate(217,183) scale(0.5)" fill="#FFF6B0"/>
      <use href="#flame" transform="translate(256,175) scale(0.5)" fill="#FFF6B0"/>
      <use href="#flame" transform="translate(295,183) scale(0.5)" fill="#FFF6B0"/>
    </g>
  </g>
</svg>
